<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Entitlements: the decision order</title>
  <desc id="desc">decideAccess checks, in order: signed in; course staff or ADMIN and SUPPORT are granted; an inactive account is refused; an unpublished course is not found; an enrollment grants by its source (revoked or refunded rows lapse, subscription rows only while the plan unlocks, others until valid_until); an active plan unlocks included courses and creates the enrollment on first open; otherwise access is denied with the lapsed reason or NOT_ENROLLED. Free preview lectures open after the decision.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .acc { fill: #ecfafc; stroke: #0E99AD; stroke-width: 1.6; }
    .zone { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .h { font: 600 20px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .m { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .k { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0b7f90; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .ld { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .la { stroke: #0E99AD; stroke-width: 1.8; fill: none; }
    .ah { fill: #64748b; }
    .aa { fill: #0E99AD; }
    .lbl { paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #111a2b; stroke: #2b3a55; }
      .acc { fill: #0d2a33; stroke: #22b8cc; }
      .zone { stroke: #475569; }
      .h, .t, .m { fill: #e2e8f0; }
      .s { fill: #94a3b8; }
      .k { fill: #5fd3e3; }
      .ln, .ld { stroke: #7c8aa5; }
      .ah { fill: #7c8aa5; }
      .la { stroke: #22b8cc; }
      .aa { fill: #22b8cc; }
      .lbl { stroke: #0b1220; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aa" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="1200" height="790" rx="14"/>
  <text class="h" x="40" y="48">Entitlements: the decision order</text>
  <text class="s" x="40" y="72">decideAccess in apps/api/src/domain/entitlements.ts. The order of the checks is the policy.</text>
  <rect class="box" x="60" y="100" width="440" height="60" rx="10"/>
  <text class="k" x="78" y="136">1</text>
  <text class="t" x="104" y="136">Signed in?</text>
  <path class="ln" d="M500 130 L598 130" marker-end="url(#a)"/>
  <text class="s lbl" x="549" y="124" text-anchor="middle">no</text>
  <rect class="box" x="600" y="100" width="300" height="60" rx="10"/>
  <text class="t" x="616" y="126">SIGNED_OUT</text>
  <text class="s" x="616" y="147">403 SIGN_IN_REQUIRED</text>
  <path class="ln" d="M280 160 L280 178" marker-end="url(#a)"/>
  <text class="s" x="292" y="174">yes</text>
  <rect class="box" x="60" y="180" width="440" height="60" rx="10"/>
  <text class="k" x="78" y="216">2</text>
  <text class="t" x="104" y="216">On this course's staff, or ADMIN / SUPPORT?</text>
  <path class="la" d="M500 210 L598 210" marker-end="url(#b)"/>
  <text class="s lbl" x="549" y="204" text-anchor="middle">yes</text>
  <rect class="acc" x="600" y="180" width="300" height="60" rx="10"/>
  <text class="t" x="616" y="206">Granted: STAFF</text>
  <text class="s" x="616" y="227">even drafts; no progress recorded</text>
  <path class="ln" d="M280 240 L280 258" marker-end="url(#a)"/>
  <text class="s" x="292" y="254">no</text>
  <rect class="box" x="60" y="260" width="440" height="60" rx="10"/>
  <text class="k" x="78" y="296">3</text>
  <text class="t" x="104" y="296">Account ACTIVE (or SUSPENDED: read-only)?</text>
  <path class="ln" d="M500 290 L598 290" marker-end="url(#a)"/>
  <text class="s lbl" x="549" y="284" text-anchor="middle">no</text>
  <rect class="box" x="600" y="260" width="300" height="60" rx="10"/>
  <text class="t" x="616" y="286">INACTIVE_ACCOUNT</text>
  <text class="s" x="616" y="307">unverified, banned, deactivated</text>
  <path class="ln" d="M280 320 L280 338" marker-end="url(#a)"/>
  <text class="s" x="292" y="334">yes</text>
  <rect class="box" x="60" y="340" width="440" height="60" rx="10"/>
  <text class="k" x="78" y="376">4</text>
  <text class="t" x="104" y="376">Course PUBLISHED?</text>
  <path class="ln" d="M500 370 L598 370" marker-end="url(#a)"/>
  <text class="s lbl" x="549" y="364" text-anchor="middle">no</text>
  <rect class="box" x="600" y="340" width="300" height="60" rx="10"/>
  <text class="t" x="616" y="366">NOT_PUBLISHED</text>
  <text class="s" x="616" y="387">answered as 404</text>
  <path class="ln" d="M280 400 L280 418" marker-end="url(#a)"/>
  <text class="s" x="292" y="414">yes</text>
  <rect class="box" x="60" y="420" width="440" height="60" rx="10"/>
  <text class="k" x="78" y="456">5</text>
  <text class="t" x="104" y="456">Does the enrollment grant, by its source?</text>
  <path class="la" d="M500 450 L598 450" marker-end="url(#b)"/>
  <text class="s lbl" x="549" y="444" text-anchor="middle">yes</text>
  <rect class="acc" x="600" y="420" width="300" height="60" rx="10"/>
  <text class="t" x="616" y="446">Granted: ENROLLMENT</text>
  <text class="s" x="616" y="467">or SUBSCRIPTION for plan rows</text>
  <path class="ln" d="M280 480 L280 498" marker-end="url(#a)"/>
  <text class="s" x="292" y="494">no, or none</text>
  <rect class="box" x="60" y="500" width="440" height="60" rx="10"/>
  <text class="k" x="78" y="536">6</text>
  <text class="t" x="104" y="536">Included in a plan that unlocks now?</text>
  <path class="la" d="M500 530 L598 530" marker-end="url(#b)"/>
  <text class="s lbl" x="549" y="524" text-anchor="middle">yes</text>
  <rect class="acc" x="600" y="500" width="300" height="60" rx="10"/>
  <text class="t" x="616" y="526">Granted: SUBSCRIPTION</text>
  <text class="s" x="616" y="547">enrollment created on first open</text>
  <path class="ln" d="M280 560 L280 578" marker-end="url(#a)"/>
  <text class="s" x="292" y="574">no</text>
  <rect class="box" x="60" y="580" width="840" height="60" rx="10"/>
  <text class="k" x="78" y="616">7</text>
  <text class="t" x="104" y="606">Denied: 403 COURSE_ACCESS_REQUIRED with details.reason</text>
  <text class="s" x="104" y="627">the lapsed reason from step 5 (EXPIRED, REVOKED, REFUNDED, SUBSCRIPTION_ENDED), else NOT_ENROLLED</text>

  <rect class="zone" x="930" y="400" width="230" height="240" rx="10"/>
  <text class="t" x="946" y="426">Step 5, by source</text>
  <text class="s" x="946" y="452">REVOKED row: lapsed,</text>
  <text class="s" x="946" y="470">REFUNDED if its order was</text>
  <text class="s" x="946" y="488">fully refunded, else REVOKED</text>
  <text class="s" x="946" y="514">SUBSCRIPTION: only while</text>
  <text class="s" x="946" y="532">the plan unlocks, else</text>
  <text class="s" x="946" y="550">SUBSCRIPTION_ENDED</text>
  <text class="s" x="946" y="576">FREE, PURCHASE, BUNDLE,</text>
  <text class="s" x="946" y="594">GRANT: until valid_until</text>
  <text class="s" x="946" y="612">(NULL is for life), else EXPIRED</text>

  <rect class="zone" x="930" y="100" width="230" height="280" rx="10"/>
  <text class="t" x="946" y="126">A plan unlocks while</text>
  <text class="s" x="946" y="152">TRIALING or ACTIVE: until</text>
  <text class="s" x="946" y="170">the period (or trial) ends</text>
  <text class="s" x="946" y="196">PAST_DUE: until the period</text>
  <text class="s" x="946" y="214">end plus grace days (3)</text>
  <text class="s" x="946" y="240">CANCELED: until the paid</text>
  <text class="s" x="946" y="258">period ends</text>
  <text class="s" x="946" y="284">INCOMPLETE, EXPIRED: never</text>
  <text class="s" x="946" y="310">and only for courses with</text>
  <text class="s" x="946" y="328">included_in_subscription</text>

  <rect class="acc" x="60" y="680" width="1100" height="80" rx="10"/>
  <text class="t" x="80" y="710">After the decision: free previews</text>
  <text class="s" x="80" y="734">A LECTURE item marked is_preview on a published course opens for anyone, signed in or not. Heartbeats and "mark as done" answer</text>
  <text class="s" x="80" y="752">409 PREVIEW, notes are refused, and an EVS session for a signed-out viewer uses the viewer id preview-anon.</text>
</svg>
