<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Data model by domain</title>
  <desc id="desc">The tables of db/migrations/0001_init.sql grouped by domain: identity, catalog, curriculum, assessments, commerce, learning, community and platform, with the constraints that carry rules: one live subscription per learner, one open quiz attempt, one active price per item and currency, webhook deduplication, deferrable dense positions, gap-free invoice numbers and the order total check.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .acc { fill: #ecfafc; stroke: #0E99AD; stroke-width: 1.6; }
    .zone { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .h { font: 600 20px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .m { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .k { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0b7f90; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .ld { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .la { stroke: #0E99AD; stroke-width: 1.8; fill: none; }
    .ah { fill: #64748b; }
    .aa { fill: #0E99AD; }
    .lbl { paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #111a2b; stroke: #2b3a55; }
      .acc { fill: #0d2a33; stroke: #22b8cc; }
      .zone { stroke: #475569; }
      .h, .t, .m { fill: #e2e8f0; }
      .s { fill: #94a3b8; }
      .k { fill: #5fd3e3; }
      .ln, .ld { stroke: #7c8aa5; }
      .ah { fill: #7c8aa5; }
      .la { stroke: #22b8cc; }
      .aa { fill: #22b8cc; }
      .lbl { stroke: #0b1220; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aa" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="1200" height="840" rx="14"/>
  <text class="h" x="40" y="48">Data model by domain</text>
  <text class="s" x="40" y="72">db/migrations/0001_init.sql: ULID text keys, timestamptz(3), money as bigint minor units with a currency.</text>
  <rect class="box" x="40" y="100" width="260" height="230" rx="12"/>
  <text class="t" x="56" y="128">Identity</text>
  <text class="m" x="56" y="156">users</text>
  <text class="m" x="56" y="178">sessions</text>
  <text class="m" x="56" y="200">auth_tokens</text>
  <text class="m" x="56" y="222">totp_recovery_codes</text>
  <text class="m" x="56" y="244">media_uploads</text>
  <rect class="box" x="320" y="100" width="260" height="230" rx="12"/>
  <text class="t" x="336" y="128">Catalog</text>
  <text class="m" x="336" y="156">categories</text>
  <text class="m" x="336" y="178">courses</text>
  <text class="m" x="336" y="200">course_categories</text>
  <text class="m" x="336" y="222">course_staff</text>
  <text class="m" x="336" y="244">bundles</text>
  <text class="m" x="336" y="266">bundle_courses</text>
  <text class="m" x="336" y="288">plans</text>
  <rect class="box" x="600" y="100" width="260" height="230" rx="12"/>
  <text class="t" x="616" y="128">Curriculum</text>
  <text class="m" x="616" y="156">course_sections</text>
  <text class="m" x="616" y="178">course_items</text>
  <text class="m" x="616" y="200">lectures</text>
  <text class="m" x="616" y="222">lecture_resources</text>
  <rect class="box" x="880" y="100" width="280" height="230" rx="12"/>
  <text class="t" x="896" y="128">Assessments</text>
  <text class="m" x="896" y="156">questions</text>
  <text class="m" x="896" y="178">quizzes</text>
  <text class="m" x="896" y="200">quiz_questions</text>
  <text class="m" x="896" y="222">quiz_attempts</text>
  <text class="m" x="896" y="244">assignments</text>
  <text class="m" x="896" y="266">assignment_submissions</text>
  <text class="m" x="896" y="288">submission_files</text>
  <rect class="acc" x="40" y="360" width="540" height="300" rx="12"/>
  <text class="t" x="56" y="388">Commerce</text>
  <text class="m" x="56" y="416">prices</text>
  <text class="m" x="56" y="438">coupons</text>
  <text class="m" x="56" y="460">coupon_targets</text>
  <text class="m" x="56" y="482">coupon_redemptions</text>
  <text class="m" x="56" y="504">gateway_customers</text>
  <text class="m" x="56" y="526">orders</text>
  <text class="m" x="316" y="416">order_items</text>
  <text class="m" x="316" y="438">payment_events</text>
  <text class="m" x="316" y="460">refunds</text>
  <text class="m" x="316" y="482">subscriptions</text>
  <text class="m" x="316" y="504">invoice_sequences</text>
  <text class="m" x="316" y="526">invoices</text>
  <rect class="acc" x="600" y="360" width="260" height="300" rx="12"/>
  <text class="t" x="616" y="388">Learning</text>
  <text class="m" x="616" y="416">enrollments</text>
  <text class="m" x="616" y="438">item_progress</text>
  <text class="m" x="616" y="460">notes</text>
  <text class="m" x="616" y="482">bookmarks</text>
  <text class="m" x="616" y="504">saved_courses</text>
  <text class="m" x="616" y="526">certificates</text>
  <rect class="box" x="880" y="360" width="280" height="140" rx="12"/>
  <text class="t" x="896" y="388">Community</text>
  <text class="m" x="896" y="416">reviews</text>
  <text class="m" x="896" y="438">qa_threads</text>
  <text class="m" x="896" y="460">qa_replies</text>
  <text class="m" x="896" y="482">reports</text>
  <rect class="box" x="880" y="520" width="280" height="140" rx="12"/>
  <text class="t" x="896" y="548">Platform</text>
  <text class="m" x="896" y="576">notifications</text>
  <text class="m" x="896" y="598">settings</text>
  <text class="m" x="896" y="620">audit_log</text>
  <text class="m" x="896" y="642">schema_migrations</text>
  <path class="ln" d="M580 200 L598 200" marker-end="url(#a)"/>
  <path class="ln" d="M860 200 L878 200" marker-end="url(#a)"/>
  <path class="ln" d="M170 330 L170 358" marker-end="url(#a)"/>
  <path class="ln" d="M730 330 L730 358" marker-end="url(#a)"/>
  <path class="la" d="M580 520 L598 520" marker-end="url(#b)"/>
  <text class="k" x="616" y="300">course_items feed</text>
  <text class="k" x="616" y="318">item_progress below</text>
  <text class="k" x="616" y="626">PURCHASE and BUNDLE</text>
  <text class="k" x="616" y="644">enrollments from orders</text>

  <rect class="zone" x="40" y="680" width="1120" height="140" rx="12"/>
  <text class="t" x="60" y="708">Constraints that carry a rule</text>
  <text class="s" x="60" y="734">subscriptions_one_live_idx: one live subscription per learner</text>
  <text class="s" x="60" y="756">quiz_attempts_one_open_idx: one open attempt per learner and quiz</text>
  <text class="s" x="60" y="778">prices_one_time_key, prices_recurring_key: one active price per item and currency</text>
  <text class="s" x="60" y="800">payment_events UNIQUE (gateway, event_id): each webhook processed once</text>
  <text class="s" x="620" y="734">course_sections, course_items: dense positions, DEFERRABLE unique</text>
  <text class="s" x="620" y="756">invoice_sequences: gap-free INV and CN numbers per year</text>
  <text class="s" x="620" y="778">orders CHECK: total = subtotal - discount + exclusive tax</text>
  <text class="s" x="620" y="800">orders UNIQUE (user_id, idempotency_key); enrollments UNIQUE (user, course)</text>
</svg>
