# Generated by scripts/gen-openapi.ts from apps/api/src/routes. Do not edit by hand: run `pnpm openapi`.
openapi: 3.1.0
info:
  title: Euron Open LMS API
  version: 0.1.0
  description: |
    REST API of Euron Open LMS. Sign in with POST /api/auth/login to get a short-lived access
    token (send it as `Authorization: Bearer <token>`) and an httpOnly refresh cookie that
    POST /api/auth/refresh rotates. Webhooks (/api/webhooks/*) take no token: each one verifies
    its provider's signature over the raw body (docs/api/webhooks.md).
    Errors are `{ "error": string, "code": string, "details"?: unknown, "requestId": string }`;
    unexpected failures return 500 with a `requestId` and never the underlying message.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:3530
    description: Local stack (make up), through the web app's proxy
  - url: https://{host}
    variables: { host: { default: app.example.com } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "Access token from POST /api/auth/login or /api/auth/refresh." }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string }, requestId: { type: string } }
tags:
  - name: "auth"
    description: "sign-up, sign-in, sessions, email verification, password reset and two-factor."
  - name: "users"
    description: "your account, sessions, export and deletion."
  - name: "meta"
    description: "public facts about the academy for page titles, checkout and the sign-up form."
  - name: "media"
    description: "direct-to-storage uploads, media lookup, and the local-storage stand-in for presigned URLs."
  - name: "notifications"
    description: "your notification inbox."
  - name: "catalog"
    description: "the public catalog (published courses only), course pages, bundles, instructors, free enrollment and the wishlist."
  - name: "learn"
    description: "the classroom. Every route goes through services/access.service.ts (an enrollment, an active plan, course staff, or a free preview item). The `items/` and `notes/` routes are declared before `/:courseSlug` so the literal segments win."
  - name: "my"
    description: "the signed-in learner's own learning."
  - name: "certificates"
    description: "anyone may verify a serial; only its owner downloads the PDF."
  - name: "assessments"
    description: "quiz attempts and assignment submissions (learners with course access)."
  - name: "community"
    description: "course reviews, lecture Q&A and reports."
  - name: "checkout"
    description: "plans on sale, quotes, starting a payment, the Razorpay return and order status."
  - name: "billing"
    description: "your orders, invoices and subscription."
  - name: "admin/courses"
    description: "the course editor (authoring). Area \"courses\". ADMIN sees every course, SUPPORT reads every course, an INSTRUCTOR only the courses they are staff on (anything else is 404). OWNER (or ADMIN) manages settings, prices, staff and status; EDITOR edits content; GRADER reads. A viewer without the right gets 403 COURSE_ROLE_REQUIRED."
  - name: "admin/catalog"
    description: "the category taxonomy. Area \"courses\" reads; only ADMIN writes."
  - name: "admin/evs"
    description: "the euron-video-system video picker for authors. Area \"courses\"."
  - name: "admin/grading"
    description: "the assignment review queue (area \"grading\"; instructors see the courses they are on)."
  - name: "admin/moderation"
    description: "reports on reviews and Q&A (area \"moderation\")."
  - name: "admin/commerce"
    description: "orders and refunds, subscriptions, plans, bundles, coupons and the orders CSV."
  - name: "admin"
    description: "/api/admin operations: the operator session, the overview, learners and enrollments, certificates, staff roles, settings, integrations and the audit trail. Every route is signed in; each service opens with requireArea(actor, area) (domain/admin-permissions.ts), which is a 403 FORBIDDEN_AREA for roles without the area and for learners."
  - name: "webhooks/evs"
    description: "POST /api/webhooks/evs: euron-video-system events. Raw body (Buffer), no auth; the EVS-Signature header (t=..,v1=.., HMAC-SHA256 with EVS_WEBHOOK_SECRET, 5 min tolerance) is verified before anything is read."
  - name: "webhooks"
    description: "/api/webhooks/stripe and /api/webhooks/razorpay: raw bodies, no auth, signature verified first, deduplicated by event id."
