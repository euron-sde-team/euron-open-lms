# ─────────────────────────────────────────────────────────────────────────────
# Euron Open LMS: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base keeps media on a volume (STORAGE=local) and sends mail straight
# to Mailpit (MAIL_MODE=smtp); the overlays switch both to S3 and SES.
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   web 3530   api 5026   postgres 5492   redis 6429   mailpit 8046 (smtp 1046)
#   floci 4597   stubs 5119
#
# The browser only ever talks to the web app: it proxies /api/* to the API
# (API_INTERNAL_URL), so the refresh cookie is first-party, exactly as behind the load
# balancer on AWS. The API port is published for curl and the integration tools.
#
# Payments, AI and video run against apps/stubs, one local server that speaks the
# Stripe, Razorpay, OpenAI and euron-video-system APIs (hosted checkout pages, signed
# webhooks, a test video stream), so every flow works with no account anywhere. Point
# the STRIPE_*, RAZORPAY_*, OPENAI_* and EVS_* variables at the real services in .env
# to use them instead: see docs/guides/payments.md and docs/guides/video-with-evs.md.
# ─────────────────────────────────────────────────────────────────────────────
name: open-lms

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation under the variable's own name, so `--env-file .env.aws` (make up-aws)
# and your shell can set it; the overlays then set their own values on top. Precedence,
# highest first: an overlay's `environment:`, your shell, the last --env-file
# (.env.aws for up-aws, then .env), the default below. Keys the base does not set at
# all (S3_BUCKET, MEDIA_ORIGINS, ...) also reach the containers through the overlay's
# `env_file:`.
x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  NODE_ENV: development
  TZ: UTC
  PORT: "5026"
  LOG_LEVEL: ${LOG_LEVEL:-${LMS_LOG_LEVEL:-info}}
  PRODUCT_NAME: ${PRODUCT_NAME:-${LMS_PRODUCT_NAME:-Euron Open LMS}}
  APP_WEB_URL: http://localhost:${LMS_WEB_PORT:-3530}
  # Same origin as the web app: the browser reaches the API through the web proxy.
  PUBLIC_API_URL: http://localhost:${LMS_WEB_PORT:-3530}
  CORS_ORIGINS: http://localhost:${LMS_WEB_PORT:-3530}
  TRUST_PROXY: "1"
  DATABASE_URL: postgres://lms:lms@postgres:5432/lms
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  # Migrations run once, in the `migrate` one-shot, before the API and worker start.
  MIGRATE_ON_BOOT: "false"
  REDIS_URL: redis://redis:6379
  JOBS_MODE: queue
  JWT_SECRET: ${LMS_JWT_SECRET:?run `make env` first}
  REFRESH_SECRET: ${LMS_REFRESH_SECRET:?run `make env` first}
  # 32 random bytes, base64: encrypts stored TOTP secrets. `make env` adds it to an
  # existing .env as well.
  TOTP_ENCRYPTION_KEY: ${LMS_TOTP_ENCRYPTION_KEY:?run `make env` first}
  COOKIE_SECURE: "false"
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  STORAGE: ${STORAGE:-local}
  DATA_DIR: /app/data
  MAIL_MODE: ${MAIL_MODE:-smtp}
  MAIL_FROM: ${MAIL_FROM:-${LMS_PRODUCT_NAME:-Euron Open LMS} <no-reply@lms.example.test>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  # Quiz drafting, grading suggestions and polish. The stack starts on the deterministic
  # stub; set AI_PROVIDER=openai (or gemini) plus the key in .env to use a real model,
  # or AI_PROVIDER=none to hide AI features.
  AI_PROVIDER: ${AI_PROVIDER:-stub}
  AI_STUB_URL: ${AI_STUB_URL:-http://stubs:5119}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  # Stripe, against the stub unless STRIPE_API_BASE says otherwise. The keys and
  # secrets are local throwaways from `make env`, shared with the stub.
  STRIPE_API_BASE: ${STRIPE_API_BASE:-http://stubs:5119}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-${LMS_STRIPE_SECRET_KEY:?run `make env` first}}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_local}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-${LMS_STRIPE_WEBHOOK_SECRET:?run `make env` first}}
  # Razorpay, against the stub: its fake Checkout.js is served to the browser from the
  # stub's published port.
  RAZORPAY_API_BASE: ${RAZORPAY_API_BASE:-http://stubs:5119}
  RAZORPAY_CHECKOUT_SCRIPT_URL: ${RAZORPAY_CHECKOUT_SCRIPT_URL:-http://localhost:${LMS_STUB_PORT:-5119}/stub/razorpay/checkout.js}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_local}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-${LMS_RAZORPAY_KEY_SECRET:?run `make env` first}}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-${LMS_RAZORPAY_WEBHOOK_SECRET:?run `make env` first}}
  # euron-video-system, against the stub's EVS API and test stream.
  EVS_BASE_URL: ${EVS_BASE_URL:-http://stubs:5119}
  EVS_PLAYBACK_KEY: ${EVS_PLAYBACK_KEY:-${LMS_EVS_PLAYBACK_KEY:?run `make env` first}}
  EVS_READ_KEY: ${EVS_READ_KEY:-${LMS_EVS_PLAYBACK_KEY:?run `make env` first}}
  EVS_WEBHOOK_SECRET: ${EVS_WEBHOOK_SECRET:-${LMS_EVS_WEBHOOK_SECRET:?run `make env` first}}

# api, worker and migrate are one image with three commands. Each carries the same build
# so any of them can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - "127.0.0.1:${LMS_PG_PORT:-5492}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 3s
      timeout: 3s
      retries: 30

  # BullMQ and rate limits. A plain container in every
  # local setup; ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LMS_REDIS_PORT:-6429}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Every mail the stack sends lands here (directly with MAIL_MODE=smtp, or relayed by
  # the emulator's SES with MAIL_MODE=ses). Web UI: http://localhost:8046
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${LMS_MAILPIT_PORT:-8046}:8025"
      # SMTP, for MAIL_MODE=smtp (the integration matrix sends straight to it).
      - "127.0.0.1:${LMS_SMTP_PORT:-1046}:1025"

  # Local stand-ins for Stripe, Razorpay, OpenAI and euron-video-system (apps/stubs).
  # It signs webhooks with the same secrets the API verifies them with, so the real
  # verification code runs; the browser reaches its hosted pages on the published port.
  stubs:
    build:
      context: ../..
      dockerfile: infra/docker/stubs.Dockerfile
    image: open-lms-stubs:local
    environment:
      PORT: "5119"
      STUB_PUBLIC_URL: http://localhost:${LMS_STUB_PORT:-5119}
      STUB_WEBHOOK_TARGET: http://api:5026/api/webhooks/stripe
      STUB_RAZORPAY_WEBHOOK_TARGET: http://api:5026/api/webhooks/razorpay
      STUB_EVS_WEBHOOK_TARGET: http://api:5026/api/webhooks/evs
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-${LMS_STRIPE_SECRET_KEY:?run `make env` first}}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-${LMS_STRIPE_WEBHOOK_SECRET:?run `make env` first}}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_local}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-${LMS_RAZORPAY_KEY_SECRET:?run `make env` first}}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-${LMS_RAZORPAY_WEBHOOK_SECRET:?run `make env` first}}
      EVS_PLAYBACK_KEY: ${LMS_EVS_PLAYBACK_KEY:?run `make env` first}
      EVS_WEBHOOK_SECRET: ${EVS_WEBHOOK_SECRET:-${LMS_EVS_WEBHOOK_SECRET:?run `make env` first}}
    ports:
      - "127.0.0.1:${LMS_STUB_PORT:-5119}:5119"
    restart: unless-stopped

  # One-shot: apply db/migrations, then exit 0. The API and worker wait for it.
  migrate:
    build: *api-build
    image: open-lms-api:local
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: open-lms-api:local
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${LMS_API_PORT:-5026}:5026"
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      stubs:
        condition: service_started
    restart: unless-stopped

  worker:
    build: *api-build
    image: open-lms-api:local
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      <<: *api-env
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    # No HTTP port: the image's /up check does not apply.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:5026
    image: open-lms-web:local
    environment:
      # Server side only: where the Next server proxies /api/*.
      API_INTERNAL_URL: http://api:5026
      PRODUCT_NAME: ${PRODUCT_NAME:-${LMS_PRODUCT_NAME:-Euron Open LMS}}
      # Where lecture video plays from (the CSP's media-src and connect-src): the stub's
      # EVS stream locally; your EVS API and media origins in production.
      VIDEO_ORIGINS: ${VIDEO_ORIGINS:-http://localhost:${LMS_STUB_PORT:-5119}}
    ports:
      - "127.0.0.1:${LMS_WEB_PORT:-3530}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mediadata:
