# ─────────────────────────────────────────────────────────────────────────────
# Overlay: emulated AWS with Floci (https://github.com/floci-io/floci, MIT).
#
# The SAME Terraform modules that provision real AWS (infra/terraform/modules) run here
# against the emulator: the `terraform` one-shot applies infra/terraform/envs/local-floci
# (media bucket with CORS, KMS key, Secrets Manager secrets, Route53 zone, SES identity
# with DKIM) before anything that needs them starts. The API then uses S3 and SES
# exactly as it does on AWS:
#
#   media   S3 bucket open-lms-local-media, SSE-KMS (alias/open-lms-local). The
#           browser uploads to presigned URLs on http://localhost:4597 (S3_PUBLIC_ENDPOINT)
#           while the API talks to the emulator on the compose network.
#   mail    SES v2, identity lms.example.test verified through DKIM; the emulator
#           relays every message to Mailpit (http://localhost:8046)
#
# Redis stays a plain container. Floci 2.3.0 emulates the ElastiCache control plane, but
# only backs a replication group with a real (Valkey) server when it can reach the
# Docker socket; mounting that into an emulator is not worth it for a local cache.
# ─────────────────────────────────────────────────────────────────────────────
x-floci-env: &floci-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://floci:4566
  STORAGE: s3
  S3_BUCKET: open-lms-local-media
  S3_REGION: us-east-1
  S3_PUBLIC_ENDPOINT: http://localhost:${LMS_FLOCI_PORT:-4597}
  MAIL_MODE: ses
  SES_REGION: us-east-1
  SES_CONFIGURATION_SET: open-lms-local-mail

x-after-terraform: &after-terraform
  terraform:
    condition: service_completed_successfully

services:
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
      # Relay every SES send to Mailpit so mail can be read in a browser.
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${LMS_FLOCI_PORT:-4597}:4566"
    volumes:
      - flocidata:/data
    # No healthcheck: the image ships no HTTP client; the terraform one-shot polls it.
    networks:
      default:
        # The S3 Control API (bucket tagging) addresses <account-id>.<endpoint>, so the
        # emulated account's name has to resolve to the emulator as well.
        aliases: ["000000000000.floci"]

  # One-shot: provision the emulator with the production modules.
  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /infra/envs/local-floci
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for floci..."
        until wget -q -O /dev/null http://floci:4566/; do sleep 1; done
        mkdir -p /tfdata/state
        terraform init -input=false -no-color >/dev/null
        # State lives in the tfdata volume, so it shares the emulator's lifecycle
        # (make down wipes both together).
        terraform apply -input=false -auto-approve -no-color -state=/tfdata/state/local.tfstate \
          -var endpoint=http://floci:4566 \
          -var app_origin=http://localhost:${LMS_WEB_PORT:-3530}
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /tfdata
    volumes:
      - ../../infra/terraform:/infra
      - tfdata:/tfdata
    depends_on:
      - floci
    restart: "no"

  migrate:
    environment:
      <<: *floci-env
    depends_on: *after-terraform

  api:
    environment:
      <<: *floci-env
    depends_on: *after-terraform

  worker:
    environment:
      <<: *floci-env
    depends_on: *after-terraform

  web:
    environment:
      # Presigned media URLs point at the emulator; the CSP must allow it.
      MEDIA_ORIGINS: http://localhost:${LMS_FLOCI_PORT:-4597}

volumes:
  flocidata:
  tfdata:
