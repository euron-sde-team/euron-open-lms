name: e2e

# The full stack on the Floci AWS emulator: Terraform provisions S3, KMS, Secrets
# Manager, Route53 and SES; Stripe, Razorpay, OpenAI and euron-video-system are the
# local stand-ins in apps/stubs (no account or key anywhere). `make demo` seeds the demo
# academy, the integration suite runs under every storage, mail and AI backend, then
# Playwright drives the web app in a browser: browse, buy a course through each gateway,
# learn in the classroom, take a quiz, earn the certificate, and the /admin console.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-floci:
    name: end-to-end on Floci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Stack up
        run: make up
      - name: Demo academy
        run: make demo
      - name: Integration matrix (storage x mail x AI provider)
        run: make test-matrix
      - name: Browser tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p open-lms logs --tail 200 api worker web migrate stubs terraform
